name: Refresh official data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * 1-5"
      timezone: "America/Toronto"
  push:
    paths:
      - "scripts/update_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: official-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official data
        run: python scripts/update_data.py

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/live.json; then
            echo "No official data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "Refresh official Canadian data"
          git push
